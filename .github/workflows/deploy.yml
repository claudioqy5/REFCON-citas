name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.225.53
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Starting continuous deployment..."
            
            # Navigate to the project folder (ensure this path matches your VPS setup)
            cd /var/www/refcon-citas || { echo "Project directory not found!"; exit 1; }
            
            # Pull latest changes from master branch
            echo "Pulling latest code from GitHub..."
            git pull origin master
            
            # Verify .env file exists, otherwise copy from example
            if [ ! -f .env ]; then
              echo "Warning: .env file not found. Copying .env.example..."
              cp .env.example .env
              echo "Please update the production credentials inside .env on your VPS!"
            fi
            
            # Build and restart Docker containers in detached mode
            echo "Building and restarting Docker services..."
            docker-compose down
            docker-compose up -d --build
            
            echo "Deployment completed successfully! 🚀"
