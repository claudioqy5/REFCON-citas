services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: refcon-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: refcon-backend
    restart: always
    depends_on:
      - sqlserver
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SistemaRecordatoriosSaaS;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET}"
      N8nSettings__WebhookUrl: "${N8N_WEBHOOK_URL}"
      AdminSettings__AdminEmail: "${ADMIN_EMAIL}"
    # No need to expose ports to the host since frontend proxies internally,
    # keeping the backend highly secure. We only expose it if needed.

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: refcon-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8085}:80"

volumes:
  mssql-data:
